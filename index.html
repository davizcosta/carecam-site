<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE-CAM | Análise de Postura</title>
  
  <!-- TensorFlow.js e Modelo de Análise de Pose (MoveNet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2rem;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 16px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px 24px;
      border-radius: 12px;
      text-align: center;
      min-width: 140px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card span {
      font-size: 2rem;
      font-weight: bold;
      display: block;
    }

    .card p {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }

    .card.total span { color: #38bdf8; }
    .card.good span { color: #4ade80; }
    .card.bad span { color: #f87171; }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>CARE-CAM</h1>
    <div id="status" class="status-badge">A inicializar detetor de postura...</div>
  </header>

  <div class="dashboard">
    <div class="card total">
      <span id="count-total">0</span>
      <p>Pessoas</p>
    </div>
    <div class="card good">
      <span id="count-good">0</span>
      <p>Boa Postura</p>
    </div>
    <div class="card bad">
      <span id="count-bad">0</span>
      <p>Postura Incorreta</p>
    </div>
  </div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    let detector;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    
    const countTotalEl = document.getElementById('count-total');
    const countGoodEl = document.getElementById('count-good');
    const countBadEl = document.getElementById('count-bad');
    const statusEl = document.getElementById('status');

    // Conexões de pontos do esqueleto
    const SKELETON_CONNECTIONS = [
      ['nose', 'left_eye'], ['nose', 'right_eye'],
      ['left_eye', 'left_ear'], ['right_eye', 'right_ear'],
      ['left_shoulder', 'right_shoulder'],
      ['left_shoulder', 'left_elbow'], ['left_elbow', 'left_wrist'],
      ['right_shoulder', 'right_elbow'], ['right_elbow', 'right_wrist'],
      ['left_shoulder', 'left_hip'], ['right_shoulder', 'right_hip'],
      ['left_hip', 'right_hip'],
      ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
      ['right_hip', 'right_knee'], ['right_knee', 'right_ankle']
    ];

    async function init() {
      try {
        statusEl.innerText = "A carregar IA de Postura (MoveNet)...";
        
        // Inicializa o detetor multipessoa
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          {
            modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
            enableSmoothing: true
          }
        );
        
        statusEl.innerText = "A ligar câmara...";
        await startCamera();
        
        statusEl.innerText = "● SISTEMA ATIVO - ANÁLISE DE POSTURA";
        statusEl.style.color = "#4ade80";
        statusEl.style.borderColor = "#22c55e";

        detectFrame();
      } catch (err) {
        console.error(err);
        statusEl.innerText = "Erro: " + err.message;
        statusEl.style.color = "#f87171";
      }
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      
      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          resolve();
        };
      });
    }

    // Algoritmo de Avaliação da Postura
    function analyzePosture(keypoints) {
      const getPt = (name) => keypoints.find(k => k.name === name && k.score > 0.3);

      const leftShoulder = getPt('left_shoulder');
      const rightShoulder = getPt('right_shoulder');
      const nose = getPt('nose');
      const leftEar = getPt('left_ear');
      const rightEar = getPt('right_ear');

      if (!leftShoulder || !rightShoulder) {
        return { label: "Indefinido", color: "#94a3b8", isGood: false };
      }

      // Ponto médio dos ombros
      const shoulderX = (leftShoulder.x + rightShoulder.x) / 2;
      const shoulderY = (leftShoulder.y + rightShoulder.y) / 2;

      // Inclinação da linha dos ombros (ombros caídos de um lado)
      const dxS = Math.abs(leftShoulder.x - rightShoulder.x);
      const dyS = Math.abs(leftShoulder.y - rightShoulder.y);
      const shoulderAngle = Math.atan2(dyS, dxS) * (180 / Math.PI);

      // Posição da cabeça relativa aos ombros
      let headX = shoulderX;
      let headY = shoulderY - 40;

      if (nose) {
        headX = nose.x;
        headY = nose.y;
      } else if (leftEar || rightEar) {
        const ear = leftEar || rightEar;
        headX = ear.x;
        headY = ear.y;
      }

      // Ângulo de inclinação da cabeça em relação à vertical do tronco
      const dxH = Math.abs(headX - shoulderX);
      const dyH = Math.abs(headY - shoulderY);
      const headTilt = Math.atan2(dxH, dyH) * (180 / Math.PI);

      // Regra de Postura: Se a cabeça estiver muito inclinada (>20°) ou ombros tortos (>15°)
      if (headTilt > 20 || shoulderAngle > 15) {
        return { label: "Postura Incorreta", color: "#ef4444", isGood: false };
      } else {
        return { label: "Boa Postura", color: "#22c55e", isGood: true };
      }
    }

    async function detectFrame() {
      if (video.readyState === 4) {
        const poses = await detector.estimatePoses(video);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let goodCount = 0;
        let badCount = 0;

        poses.forEach((pose, index) => {
          if (pose.score < 0.25) return;

          const keypoints = pose.keypoints;
          const posture = analyzePosture(keypoints);

          if (posture.label !== "Indefinido") {
            if (posture.isGood) goodCount++;
            else badCount++;
          }

          // Desenhar linhas do esqueleto
          SKELETON_CONNECTIONS.forEach(([p1Name, p2Name]) => {
            const p1 = keypoints.find(k => k.name === p1Name);
            const p2 = keypoints.find(k => k.name === p2Name);

            if (p1 && p2 && p1.score > 0.3 && p2.score > 0.3) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = posture.color;
              ctx.lineWidth = 3;
              ctx.stroke();
            }
          });

          // Desenhar pontos das articulações
          keypoints.forEach(kp => {
            if (kp.score > 0.3) {
              ctx.beginPath();
              ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
            }
          });

          // Desenhar Etiqueta de Postura por cima da pessoa
          const validKps = keypoints.filter(k => k.score > 0.3);
          if (validKps.length > 0) {
            const minX = Math.min(...validKps.map(k => k.x));
            const minY = Math.min(...validKps.map(k => k.y));

            const label = `#${index + 1} | ${posture.label}`;
            ctx.font = 'bold 14px sans-serif';
            const textWidth = ctx.measureText(label).width;

            const boxY = minY > 30 ? minY - 25 : minY;
            
            // Fundo da etiqueta
            ctx.fillStyle = posture.color;
            ctx.fillRect(minX, boxY, textWidth + 14, 24);

            // Texto da etiqueta
            ctx.fillStyle = "#ffffff";
            ctx.fillText(label, minX + 7, boxY + 17);
          }
        });

        // Atualizar os contadores no Dashboard
        countTotalEl.innerText = goodCount + badCount;
        countGoodEl.innerText = goodCount;
        countBadEl.innerText = badCount;
      }

      requestAnimationFrame(detectFrame);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
