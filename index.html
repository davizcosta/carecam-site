<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE-CAM | Sistema de Deteção de Pessoas</title>
  
  <!-- TensorFlow.js e Modelo COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 16px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .counter-card {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      padding: 15px 30px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .counter-card span {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      display: block;
    }

    .counter-card p {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>CARE-CAM</h1>
    <div id="status" class="status-badge">A inicializar sistema...</div>
  </header>

  <div class="counter-card">
    <span id="count">0</span>
    <p>Pessoas Detetadas</p>
  </div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    let model;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');

    // Configurações para detetar MULTIPLAS PESSOAS
    const MAX_PERSONS = 50;        // Aumentado para até 50 pessoas
    const MIN_CONFIDENCE = 0.35;   // Sensibilidade ajustada (35%) para pegar pessoas mais distantes

    async function init() {
      try {
        statusEl.innerText = "A carregar modelo de IA...";
        // Carrega o modelo de visão computacional
        model = await cocoSsd.load();
        
        statusEl.innerText = "A solicitar acesso à câmara...";
        await startCamera();
        
        statusEl.innerText = "● SISTEMA ATIVO E A MONITORIZAR";
        statusEl.style.color = "#4ade80";
        statusEl.style.borderColor = "#22c55e";

        // Inicia o ciclo de deteção
        detectFrame();
      } catch (err) {
        console.error(err);
        statusEl.innerText = "Erro: " + err.message;
        statusEl.style.color = "#f87171";
      }
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "user"
        },
        audio: false
      });
      
      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          resolve();
        };
      });
    }

    async function detectFrame() {
      if (video.readyState === 4) {
        // Realiza a deteção sem limite restrito de 5 pessoas
        const predictions = await model.detect(video, MAX_PERSONS, MIN_CONFIDENCE);
        
        // Filtra estritamente a classe "person"
        const persons = predictions.filter(pred => pred.class === 'person');

        // Limpa o canvas anterior
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Atualiza a contagem no ecrã
        countEl.innerText = persons.length;

        // Desenha a caixa e identificação de cada pessoa
        persons.forEach((person, index) => {
          const [x, y, width, height] = person.bbox;
          const score = Math.round(person.score * 100);

          // Desenha a caixa ao redor da pessoa
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, width, height);

          // Fundo para a etiqueta de identificação
          const label = `Pessoa #${index + 1} (${score}%)`;
          ctx.font = 'bold 15px sans-serif';
          const textWidth = ctx.measureText(label).width;

          ctx.fillStyle = '#0284c7';
          const labelY = y > 25 ? y - 25 : y;
          ctx.fillRect(x, labelY, textWidth + 10, 22);

          // Texto da etiqueta
          ctx.fillStyle = '#ffffff';
          ctx.fillText(label, x + 5, labelY + 16);
        });
      }

      // Mantém o ciclo continuo em tempo real
      requestAnimationFrame(detectFrame);
    }

    // Iniciar a aplicação assim que a página carregar
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
